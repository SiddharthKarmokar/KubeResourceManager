basePath: /
definitions:
  github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.EstimatedSavings:
    properties:
      cpu:
        example: 0.73 cores
        type: string
      memory:
        example: 1138 MB
        type: string
    type: object
  github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.Recommendation:
    properties:
      confidence_score:
        type: number
      cpu_reduction_percent:
        type: integer
      current_cpu_request:
        type: integer
      current_memory_request:
        type: integer
      deployment:
        type: string
      estimated_monthly_savings:
        $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.EstimatedSavings'
      memory_reduction_percent:
        type: integer
      reason:
        type: string
      recommended_cpu:
        type: integer
      recommended_memory:
        type: integer
      severity:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.WorkloadMetrics:
    description: Workload identifier plus CPU/memory requests and average utilization
      (millicores and MiB).
    properties:
      cpu_request:
        example: 1000
        type: integer
      cpu_usage_avg:
        example: 180
        minimum: 0
        type: integer
      deployment:
        example: api-service
        type: string
      memory_request:
        example: 2048
        type: integer
      memory_usage_avg:
        example: 700
        minimum: 0
        type: integer
    required:
    - cpu_request
    - cpu_usage_avg
    - deployment
    - memory_request
    - memory_usage_avg
    type: object
  github_com_SiddharthKarmokar_KubeResourceManager_internal_errors.APIError:
    properties:
      code:
        example: INVALID_INPUT
        type: string
      message:
        example: CPU usage cannot exceed CPU request for this analysis
        type: string
    type: object
  github_com_SiddharthKarmokar_KubeResourceManager_internal_errors.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_errors.APIError'
    type: object
host: localhost:8080
info:
  contact:
    email: siddkarmokar@gmail.com
    name: Siddharh Karmokar
    url: https://siddkarmokar-portfolio.vercel.app/
  description: Analyzes Kubernetes workload metrics and recommends safe CPU and memory
    requests using conservative heuristics, safety buffers, and guardrails.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Kubernetes Resource Optimization API
  version: "1.0"
paths:
  /analyze:
    post:
      consumes:
      - application/json
      description: Accepts a JSON array of workload metrics (CPU/memory request and
        average usage) and returns a JSON array of recommendations including confidence
        and severity.
      parameters:
      - description: Metrics batch (same schema as CLI JSON input)
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.WorkloadMetrics'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_domain_models.Recommendation'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_SiddharthKarmokar_KubeResourceManager_internal_errors.ErrorResponse'
      summary: Analyze workload metrics
      tags:
      - Optimization
  /healthz:
    get:
      description: Returns 200 if the server is alive
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - System
  /metrics:
    get:
      description: Prometheus text exposition format (OpenMetrics / text/plain).
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - System
  /readyz:
    get:
      description: Returns 200 if the server is ready to accept traffic
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Readiness check
      tags:
      - System
schemes:
- http
- https
swagger: "2.0"
